[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recur-deck"
version = "1.0.0"
description = "Build Recur's first-touch outreach deck for any company in one command."
requires-python = ">=3.11"
dependencies = [
    "python-pptx==1.0.2",
    "pillow>=11,<14",
    "numpy>=2.0,<3",
    "fonttools>=4.50,<5",
    "resvg-py>=0.5,<0.6",
    "pymupdf>=1.24,<2",
    "pydantic>=2.7,<3",
    "anthropic>=2.6,<3",
    "httpx>=0.27,<1",
    "tenacity>=8.2,<10",
    "beautifulsoup4>=4.12,<5",
    "lxml>=5,<7",
    "tldextract>=5.1,<6",
    "python-dotenv>=1.0,<2",
    "rich>=13.7,<15",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
recur-deck = "recur_deck.cli:main"

[tool.setuptools.packages.find]
include = ["recur_deck*"]

[tool.setuptools.package-data]
recur_deck = ["prompts/*.md"]
